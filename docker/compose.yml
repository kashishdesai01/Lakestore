services:
  minio:
    build:
      context: .
      dockerfile: minio.Dockerfile
    image: lakestore-minio:2025-10-15
    command: server /data
    environment:
      MINIO_ROOT_USER: lakestore
      MINIO_ROOT_PASSWORD: lakestore-local-password
    ports: ["127.0.0.1:19000:9000"]
    tmpfs: ["/data"]
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --inMemoryPersistence
    ports: ["127.0.0.1:11000:10000"]
